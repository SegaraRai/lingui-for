packages:
  - apps/*
  - examples/*
  - packages/*
  - shared/*
  - tools/*

allowBuilds:
  esbuild: true
  sharp: true
  wasm-pack: true
  workerd: false # The runtime resolves its binary from the platform package.

catalogs:
  default:
    "@arethetypeswrong/core": ^0.18.5
    "@astrojs/check": 0.9.10
    "@astrojs/node": ^11.1.12
    "@astrojs/astro2tsx": ^0.1.4
    "@astrojs/react": ^7.1.8
    "@astrojs/svelte": ^9.1.5
    "@babel/core": ^8.1.2
    "@babel/generator": ^8.1.2
    "@babel/traverse": ^8.1.2
    "@babel/types": ^8.1.2
    "@jridgewell/trace-mapping": ^0.3.31
    "@lingui/babel-plugin-lingui-macro": ^6.12.0
    "@lingui/cli": ^6.12.0
    "@lingui/conf": ^6.12.0
    "@lingui/core": ^6.12.0
    "@lingui/format-po": ^6.12.0
    "@lingui/native-tools": ^0.2.0
    "@lingui/react": ^6.12.0
    "@sveltejs/adapter-node": ^6.0.2
    "@sveltejs/kit": ^3.2.0
    "@stillwind/cli": ^0.9.0
    "@stillwind/integration": ^0.9.0
    "@sveltejs/vite-plugin-svelte": ^7.3.1
    "@types/babel__core": ^7.20.5
    "@types/babel__traverse": ^7.28.0
    "@types/node": ^26.6.6
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    astro: ^7.4.11
    cf: ^1.0.0-beta.29
    astro-strip-whitespace: ^0.2.2
    daisyui: ^5.7.50
    dedent: ^1.7.2
    playwright: ^1.65.0
    react: ^19.3.1
    react-dom: ^19.3.1
    stillwind: ^0.9.0
    svelte: ^5.57.3
    svelte-check: ^4.7.8
    typescript: ^6.0.3
    vite: npm:@voidzero-dev/vite-plus-core@1.6.0
    vite-plus: 1.6.0

  dep:
    "@babel/core": "^7.24.0 || ^8"
    "@babel/parser": "^7.24.0 || ^8"
    "@babel/traverse": "^7.24.0 || ^8"
    "@babel/types": "^7.24.0 || ^8"
    "@lingui/cli": "^5 || ^6"
    "@lingui/conf": "^5 || ^6"
    "@lingui/core": "^5 || ^6"
    "@lingui/babel-plugin-lingui-macro": "^5 || ^6"
    "@lingui/native-tools": ^0.2.0
    astro: "^5 || ^6 || ^7"
    cosmiconfig: "^9 || ^10"
    esbuild: "*"
    jiti: ^2
    oxc-parser: ">=0.100.0 <1.0.0"
    rolldown: ^1
    rollup: "^3 || ^4"
    svelte: ^5
    unplugin: ^3
    vite: npm:@voidzero-dev/vite-plus-core@1.6.0
    webpack: "^4 || ^5"

versioning:
  # Releases before 1.0 can break existing code with a minor version. The cap keeps an intent
  # from releasing 1.0 by accident.
  maxBump: minor
  changelog:
    storage: repository
  # `fixed` and `ignore` accept exact names only. tools/release/versioning.test.ts keeps them in
  # step with the workspace.
  fixed:
    - - "@lingui-for/framework-core"
      - "lingui-for-astro"
      - "lingui-for-svelte"
  ignore:
    - "@lingui-for/internal-lingui-analyzer-wasm"
    - "@lingui-for/internal-shared-common"
    - "@lingui-for/internal-shared-test-helpers"
    - "@lingui-for/internal-tools-release"
    - "@lingui-for/internal-tools-sites"
    - "config-types"
    - "conformance"
    - "docs"
    - "e2e-astro"
    - "e2e-svelte"
    - "lingui-for-workspace"

minimumReleaseAgeExclude:
  - "@astrojs/starlight@0.42.0"
  - "@stillwind/*"
  - stillwind
  - "@tsrs/*"
  - tsrs
  - "@voidzero-dev/vite-plus-core@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0"
  - vite-plus@1.6.0

overrides:
  # @astrojs/language-server 2.17+ uses @astrojs/astro2tsx, which fails to parse HTML comment-only
  # interpolations nested in expressions (examples/e2e-astro/src/pages/interpolation.astro).
  # Remove this pin (and the exact @astrojs/check version) once astro2tsx handles them.
  "@astrojs/check>@astrojs/language-server": 2.16.16
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
