    "@lingui/babel-plugin-lingui-macro": "^5 || ^6"
    astro: "^5 || ^6 || ^7"
    cosmiconfig: ^9
    esbuild: "*"
    jiti: ^2
    oxc-parser: ">=0.100.0 <1.0.0"
    rolldown: ^1
    rollup: "^3 || ^4"
    svelte: ^5
    unplugin: ^3
    vite: ">=3"
    webpack: "^4 || ^5"

