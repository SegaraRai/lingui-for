    react: ^19.2.8
    react-dom: ^19.2.8
    svelte: ^5.57.0
    svelte-check: ^4.7.6
    tailwindcss: ^4.3.3
    typescript: ^6.0.3
    vite: npm:@voidzero-dev/vite-plus-core@latest
    vite-plus: ^0.3.0

  dep:
    "@babel/core": "^7.24.0 || ^8"
    "@babel/parser": "^7.24.0 || ^8"
    "@babel/traverse": "^7.24.0 || ^8"
    "@babel/types": "^7.24.0 || ^8"
    "@lingui/cli": "^5 || ^6"
    "@lingui/conf": "^5 || ^6"
