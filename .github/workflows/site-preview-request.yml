name: Site Preview Request

# This workflow only wakes Site Preview, which reads the label from the GitHub API.
# It runs on `pull_request` because `pull_request_target` is disabled by default on public
# repositories.
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  request:
    name: Request site Preview
    if: github.event.label.name == 'preview' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - run: echo 'Site Preview starts when this run completes.'
