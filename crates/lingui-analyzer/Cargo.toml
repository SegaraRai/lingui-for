[package]
name = "lingui-analyzer"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
lean_string = { version = "0.8.0", features = ["serde"] }
sourcemap = "9.3.2"
thiserror = "2.0.21"
tree-sitter = "0.27.2"
tree-sitter-astro = { git = "https://github.com/SegaraRai/tree-sitter-astro.git" }
tree-sitter-javascript = { git = "https://github.com/SegaraRai/tree-sitter-javascript.git" }
tree-sitter-svelte-ng = { git = "https://github.com/SegaraRai/tree-sitter-svelte.git" }
tree-sitter-typescript = { git = "https://github.com/SegaraRai/tree-sitter-typescript.git" }
tsify = { version = "0.5.8", features = ["js"] }
wasm-bindgen = "0.2.130"

[dev-dependencies]
criterion = "0.8.2"
indoc = "2.0.8"

[[bench]]
name = "stage_transforms"
harness = false
